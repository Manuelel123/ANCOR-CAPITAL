# Render Blueprint: the Atlas web service (Docker image).
# Render dashboard > New > Blueprint > this repository. Values marked
# "sync: false" are asked for when the Blueprint is created.
# The Postgres is created apart and is not declared here: a sync would create
# an empty database and point DATABASE_URL at it.
services:
  - type: web
    name: atlas
    runtime: docker
    dockerfilePath: ./Dockerfile
    # 512 MB ran out of memory on HRP and Black-Litterman.
    plan: 1c-2g
    region: virginia
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_SESSION_COOKIE_SECURE
        value: "true"
      # Render's proxy sits in front of the app (client IP for the sign-in throttle).
      - key: ATLAS_PROXY_HOPS
        value: "1"
      # Skip the vectorbt warm-up to stay under the free plan's 512 MB.
      - key: ATLAS_VECTORBT_WARMUP
        value: "0"
      # Verification codes go through Brevo's API: the free plan blocks SMTP.
      - key: BREVO_API_KEY
        sync: false
      # Sender verified in Brevo, e.g. "Atlas <you@gmail.com>".
      - key: MAIL_FROM
        sync: false
      - key: INSFORGE_URL
        sync: false
      - key: INSFORGE_API_KEY
        sync: false
      - key: TIINGO_API_KEY
        sync: false
