# Cuestionario de perfilado de riesgo (lo lee optimizacion_portafolios.profiling).
#
# Reglas generales (las aplica el código; los datos están aquí):
# - El puntaje suma los campos de `puntaje.preguntas`. Cada uno vale 0 a 3 según
#   su posición en `opciones` (la opción más cautelosa va primero y vale 0).
# - `umbrales` convierte el puntaje en nivel.
# - Dos reglas pasan por encima del puntaje: el tope del horizonte
#   (`nivel_maximo`) y los vetos. Ninguna bloquea herramientas.
# - El capital nunca limita el perfil ni el acceso: su `nivel` solo decide qué
#   instrumentos se muestran.
# - Si cambia una pregunta, una opción o una regla, sube `version`: los perfiles
#   guardados conservan la versión con la que se respondieron y los borradores
#   de una versión anterior se descartan.
version: 2

# Niveles de perfil, del más bajo al más alto. El id `adverso` se conserva porque
# está en los perfiles guardados y en el registro de decisiones.
niveles:
  - id: adverso
    etiqueta: Conservador
    descripcion: Prioriza cuidar el capital; acepta poca variación aunque eso limite la ganancia.
  - id: moderado
    etiqueta: Moderado
    descripcion: Busca crecer con caídas acotadas; acepta algo de variación a cambio de más retorno esperado.
  - id: arriesgado
    etiqueta: Arriesgado
    descripcion: Acepta caídas fuertes y prolongadas a cambio de un mayor potencial de ganancia.

# Puntaje mínimo para alcanzar cada nivel (el primer nivel no lleva umbral).
# De 0 a 3 = conservador; de 4 a 6 = moderado; de 7 a 9 = arriesgado.
umbrales:
  moderado: 4
  arriesgado: 7

puntaje:
  preguntas: [horizonte, p2, p1]
  capacidad: p6

# Bajo: menos de $5.000.000. Medio: $5.000.000 a $30.000.000. Alto: más de $30.000.000.
niveles_capital: [bajo, medio, alto]

datos_previos:
  capital:
    texto: ¿Con cuánto capital cuentas hoy para invertir?
    opciones:
      - id: menos_50k
        texto: Menos de $50.000
        nivel: bajo
      - id: 50k_200k
        texto: $50.000 a $200.000
        nivel: bajo
      - id: 200k_1m
        texto: $200.000 a $1.000.000
        nivel: bajo
      - id: 1m_5m
        texto: $1.000.000 a $5.000.000
        nivel: bajo
      - id: 5m_30m
        texto: $5.000.000 a $30.000.000
        nivel: medio
      - id: mas_30m
        texto: Más de $30.000.000
        nivel: alto
  horizonte:
    texto: ¿Cuándo necesitarías este dinero?
    # nivel_maximo: tope que impone el horizonte al perfil (null = sin tope).
    opciones:
      - id: menos_1
        texto: En menos de 1 año
        nivel_maximo: adverso
      - id: de_1_a_3
        texto: Entre 1 y 3 años
        nivel_maximo: null
      - id: de_3_a_5
        texto: Entre 3 y 5 años
        nivel_maximo: null
      - id: mas_5
        texto: Más de 5 años
        nivel_maximo: null

# Cada bloque es un paso. `campo` ubica el capital y el horizonte en el orden acordado.
bloques:
  - id: punto_de_partida
    titulo: Tu punto de partida
    descripcion: Cuéntanos qué has hecho con tu plata y con cuánto cuentas.
    preguntas:
      - id: k1
        texto: ¿Qué has hecho con tu plata hasta hoy?
        opciones:
          - Solo la gasto
          - Solo ahorro (cuenta, CDT, natillera)
          - Invierto en fondos
          - Invierto en acciones, ETF o cripto
      - campo: capital_rango
      - id: aporte
        texto: ¿Cuánto podrías aportar cada mes?
        opciones:
          - Nada
          - Menos de $50.000
          - $50.000 a $200.000
          - $200.000 a $500.000
          - Más de $500.000
  - id: objetivo
    titulo: Tu objetivo
    descripcion: Para cuándo es este dinero y qué esperas de él.
    preguntas:
      - campo: horizonte
      - id: p2
        texto: ¿Qué quieres lograr?
        opciones:
          - Cuidar mi plata y tenerla disponible
          - Que crezca con poco riesgo
          - Que crezca a largo plazo
          - Ganar lo máximo aunque pueda perder
      - id: p1
        texto: Si tu inversión baja 20 %, ¿qué harías?
        opciones: [Vendería todo, Vendería una parte, Esperaría, Invertiría más]
  - id: respaldo
    titulo: Tu respaldo
    descripcion: Qué tan cubierto estás ante un imprevisto y cómo prefieres decidir.
    preguntas:
      - id: p6
        texto: ¿Tienes fondo de emergencia?
        opciones: ['Sí', Parcialmente, 'No']
      - id: decision
        texto: ¿Cómo prefieres decidir?
        opciones:
          - Que decidan por mí
          - Que me expliquen y yo decido
          - Que me den opciones y yo elijo

# Respuestas que fuerzan el perfil más bajo, sin importar el resto. No bloquean nada.
vetos:
  - pregunta: p6
    opcion: 'No'
    explicacion: >-
      Todavía no tienes un fondo de emergencia. Ante un imprevisto tendrías que
      retirar tu inversión aunque esté en pérdida, así que tu perfil queda en
      conservador. Puedes usar todas las herramientas; los ejemplos para ti son
      de riesgo bajo, monto bajo y liquidez.
  - pregunta: p6
    opcion: Parcialmente
    explicacion: >-
      Tu fondo de emergencia todavía es parcial. Ante un imprevisto podrías tener
      que retirar tu inversión aunque esté en pérdida, así que tu perfil queda en
      conservador. Puedes usar todas las herramientas; los ejemplos para ti son
      de riesgo bajo, monto bajo y liquidez.

# Factor limitante: qué determinó el perfil final.
# Si varios factores dan el mismo nivel final, gana el primero de `desempate`.
factor_limitante:
  desempate: [veto, horizonte, tolerancia]
  etiquetas:
    veto: Respuesta determinante
    horizonte: Horizonte de inversión
    tolerancia: Puntaje de riesgo
    capacidad: Capacidad de asumir pérdidas  # perfiles de la versión 1
  # Plantillas: {perfil}, {horizonte}, {puntaje} y {puntaje_maximo}. Los vetos usan
  # su propia explicación.
  explicaciones:
    horizonte: >-
      Necesitarías este dinero {horizonte}. En un plazo así no hay tiempo suficiente
      para recuperarse de una caída fuerte, por eso tu perfil queda en «{perfil}».
    tolerancia: >-
      Tu perfil sale de tu puntaje de riesgo ({puntaje} de {puntaje_maximo}): suma
      cuándo necesitas el dinero, qué quieres lograr y qué harías ante una caída.
      Tu perfil queda en «{perfil}».

# Rol sugerido según la experiencia (el usuario lo confirma o cambia).
rol_sugerido:
  experiencia: k1
  experiencia_minima: Invierto en fondos   # esta opción o una posterior
  pregunta_control: null
  si_cumple: inversionista
  si_no: novato

# Opciones de versiones anteriores: solo para mostrar los perfiles ya guardados.
# `nivel` decide el mensaje de la guía de IBKR. El rango de 20 a 100 millones
# cruza el umbral de $30.000.000; ajústalo aquí si prefieres otro nivel.
legado:
  capital:
    menos_1m:
      texto: Menos de 1 millón de pesos
      nivel: bajo
    5m_20m:
      texto: De 5 a 20 millones de pesos
      nivel: medio
    20m_100m:
      texto: De 20 a 100 millones de pesos
      nivel: medio
    mas_100m:
      texto: Más de 100 millones de pesos
      nivel: alto
  horizonte:
    mas_3: Más de 3 años
